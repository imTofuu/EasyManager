[package]
name = "easy_manager_physical_interface"
version = "0.1.0"
authors = ["Drew Bryan <drewbryan08@gmail.com>"]
edition = "2024"
resolver = "2"
rust-version = "1.85.0"

[[bin]]
name = "easy_manager_physical_interface"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[patch.crates-io]
lvgl = { git = "https://github.com/enelson1001/lv_binding_rust" }
lvgl-sys = { git = "https://github.com/enelson1001/lv_binding_rust" }
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
easy_manager_core = { path = "../api/easy_manager_core" }

esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
esp-idf-hal = "0.46.2"
esp-idf-sys = "0.37.2"

embedded-svc = "0.29.0"
embedded-sdmmc = "0.9.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"

embassy-executor = {  version = "0.10.0", features = ["platform-std", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

lvgl = { version = "0.6.2", default-features = false, features = ["embedded_graphics", "unsafe_no_autoinit", "nightly"] }

anyhow = "1.0.102"
log = "0.4.29"
cstr_core = "0.2.6"
mfrc522 = { version = "0.8.0", features = ["std"] }
static_cell = "2.1.1"
rustyfarian-esp-idf-ws2812 = "0.6.0"
rgb = "0.8.53"
arrayvec = "0.7.8"
serde = "1.0.229"
serde_json = "1.0.151"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_st7796", version = "^1.4.0" }
bindings_header = "src/bindings.h"

[build-dependencies]
embuild = "0.33"
