[package]
name = "easy_manager_server"
version = "0.1.0"
edition = "2024"

[dependencies]
easy_manager_core = { path = "../easy_manager_core" }
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"
serde_json = "1.0.149"
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-native-tls"] }
migration = { path = "migration" }
uuid = { version = "1.21.0", features = ["v4"] }
argon2 = "0.5.3"
regex = "1.12.3"
once_cell = "1.21.3"
axum-extra = { version = "0.12.5", features = ["cookie"] }
